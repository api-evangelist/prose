name: Prose
description: 'Prose is a New York City-based direct-to-consumer beauty company that
  makes truly custom haircare and skincare. Customers complete an online consultation
  covering hair type, scalp, lifestyle, diet, and local environment, and Prose then
  formulates personalized shampoo, conditioner, hair masks, supplements, and skincare
  made to order and sold primarily through a subscription model. Prose was surfaced
  as a portfolio company of forerunner-ventures and insight-partners. It operates no
  public developer API; its verified GitHub organization publishes internal tooling
  and third-party client libraries only, so this profile carries company identity and
  a domain-security probe rather than API artifacts.'
